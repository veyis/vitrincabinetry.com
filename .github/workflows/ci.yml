name: CI

# Type-check, lint and design-token drift on every push to main and every PR.
# `next build` on Vercel is the only other gate, and nothing there lints.
# Docs-only pushes are skipped.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "analysis/**"
  pull_request:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next-env.d.ts is gitignored, so a fresh checkout has no types for static
      # asset imports and tsc would fail with TS2307 on the first one. `next
      # typegen` writes it (and the route types) without running a build.
      - name: Generate Next.js types
        run: pnpm exec next typegen

      # Run every check even if an earlier one fails, so one run reports
      # every problem instead of only the first.
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Design tokens (drift ratchet + contrast)
        if: ${{ !cancelled() }}
        run: pnpm verify:design-tokens
