name: CI

# Type-check, lint and design-token drift on every push to main and every PR.
# `next build` on Vercel is the only other gate, and nothing there lints.
# Docs-only pushes are skipped.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "analysis/**"
  pull_request:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run every check even if an earlier one fails, so one run reports
      # every problem instead of only the first.
      - name: Type check
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Design tokens (drift ratchet + contrast)
        if: ${{ !cancelled() }}
        run: pnpm verify:design-tokens
